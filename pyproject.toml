[project]
name = "eagle-io"
version = "0.1.0"
description = "Doover processor that polls eagle.io for new readings and relays them as JTS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydoover>=1.18.2"]

[project.scripts]
export-config = "eagle_io.app_config:export"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eagle_io"]

[dependency-groups]
dev = ["pytest>=8.3.5", "pytest-asyncio>=0.26.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
